# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: 不爱折腾的码农不是好程序猿
subtitle: ''
description: '日常学习和记录分享，不定期更新'
keywords:
author: ZYP
language: zh
timezone: 'Asia/Shanghai'

# URL
## Set your site url here. For example, if you use GitHub Page, set url as 'https://username.github.io/project'
url: https://blog.febirdy.com
root: /
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true # Set to false to remove trailing 'index.html' from permalinks
  trailing_html: true # Set to false to remove trailing '.html' from permalinks

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link:
  enable: true # Open external links in new tab
  field: site # Apply to the whole site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: true
marked:
  prependRoot: true
  postAsset: true
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
  # "Android折腾之路": android-player
  # "iOS摸索之路": ios-player
  # "AppCan经验分享": appcan-player
  # "瞎折腾系列": everything-player
  # "鸿蒙HarmonyOS应用开发": harmony-player
tag_map:

# Metadata elements
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss
## updated_option supports 'mtime', 'date', 'empty'
updated_option: 'mtime'

# Pagination
## Set per_page to 0 to disable pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
## include:/exclude: options only apply to the 'source/' folder
include:
exclude:
ignore:

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: febirdy

# FEBIRDY 主题的站点身份、首页和关于页文案。主题仓库只提供通用占位默认值。
febirdy_site:
  brand: FEBIRDY
  brand_suffix: BLOG
  brand_mark: FB
  tagline: 不爱折腾的码农，不是好程序猿。
  portal:
    url: https://febirdy.com
    label: 个人传送门

febirdy_home:
  eyebrow: 移动终端与系统底层开发笔记
  title: 记录代码、踩坑，以及每一次认真折腾的过程。
  description: 专注 Android、HarmonyOS、iOS 与工程实践，记录真实问题、定位过程和可复用的解决方案。
  feed_title: 最新文章
  feed_count_suffix: 篇技术沉淀

febirdy_about:
  name: ''
  tagline: ''
  quote: 把真实问题记录下来，让下一次排查少走一点弯路。
  focus: []
  tools: []
  links: []

# Aomori主题集成Giscus评论配置
aomori_giscus:
  enable: true
  repo: 'sandy1108/tech-blogs'
  repoId: 'R_kgDOMjC6IA'
  category: 'tech-blogs-discussions'
  categoryId: 'DIC_kwDOMjC6IM4Cup5C'
  mapping: "title"
  reactionsEnabled: 1
  emitMetadata: 0
  theme: 'light'
  lang: 'zh-CN'

# Deployment
## Docs: https://hexo.io/docs/one-command-deployment
deploy:
  type: ''

favicon: '/favicon.ico'

# hexo-directory-category插件配置
auto_dir_categorize:
	enable: true  # options:true, false; default is true
	force: true # options:true, false; default is false

sitemap:
  path: sitemap.xml
  tag: false
  category: false
